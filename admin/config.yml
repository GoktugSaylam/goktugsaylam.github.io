backend:
  name: github
  repo: GoktugSaylam/goktugsaylam.github.io
  branch: main

# Media Uploads
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Panel Display Settings
display_url: "https://goktugsaylam.com"
locale: "en"

# Collections
collections:
  - name: "pages"
    label: "Pages and Content"
    delete: false
    editor:
      preview: false
    files:
      - name: "about"
        label: "00 // About"
        file: "content/about.json"
        format: "json"
        fields:
          - { label: "Hero Greeting (Beyaz Başlık)", name: "heroGreeting", widget: "string", default: "Hello, I'm", required: false }
          - { label: "Hero Name (Kırmızı Vurgulu İsim)", name: "heroName", widget: "string", default: "Göktuğ Saylam", required: false }
          - { label: "Dossier Code", name: "code", widget: "string", default: "00 // ABOUT", required: false }
          - { label: "Name", name: "name", widget: "string", default: "Göktuğ Saylam" }
          - { label: "Subtitle", name: "subtitle", widget: "string", default: "Industrial Engineering Student and Game Enthusiast", required: false }
          - { label: "Role / Tagline", name: "role", widget: "string", required: false }
          - { label: "Section Title", name: "sectionTitle", widget: "string", default: "BIOGRAPHY", required: false }
          - { label: "Biography Text", name: "bio", widget: "text", required: false }
          - { label: "Handle (@username)", name: "handle", widget: "string", default: "@goktugsaylam", required: false }
          - { label: "Handle Subtitle", name: "handleSub", widget: "string", default: "mostly online as", required: false }

      - name: "organizations"
        label: "01 // Organizations"
        file: "content/organizations.json"
        format: "json"
        fields:
          - label: "Left Page Header"
            name: "header"
            widget: "object"
            required: false
            fields:
              - { label: "Dossier Code", name: "code", widget: "string", default: "01 // ORGANIZATIONS", required: false }
              - { label: "Section Name", name: "title", widget: "string", default: "Organizations" }
              - { label: "Subtitle", name: "subtitle", widget: "string", default: "Community Events", required: false }
              - { label: "Role / Tagline", name: "role", widget: "string", default: "Jam & Community Coordination", required: false }
          - label: "Organizations List (Dossier Files)"
            name: "items"
            widget: "list"
            fields:
              - { label: "Event Name (Tab Title)", name: "title", widget: "string" }
              - { label: "Role", name: "role", widget: "string", required: false }
              - { label: "Date", name: "date", widget: "string", required: false }
              - { label: "Club / Organizer", name: "sub", widget: "string", required: false }
              - label: "Links / Pennants"
                name: "links"
                widget: "list"
                required: false
                fields:
                  - label: "Platform"
                    name: "platform"
                    widget: "select"
                    options:
                      - { label: "Itch.io", value: "itch" }
                      - { label: "LinkedIn", value: "linkedin" }
                      - { label: "GitHub", value: "github" }
                      - { label: "YouTube", value: "youtube" }
                      - { label: "Website", value: "website" }
                      - { label: "X / Twitter", value: "x" }
                      - { label: "Discord", value: "discord" }
                      - { label: "Instagram", value: "instagram" }
                  - { label: "URL", name: "url", widget: "string" }
                  - { label: "Title / Hover Text", name: "title", widget: "string", required: false }

      - name: "projects"
        label: "02 // Personal Projects"
        file: "content/projects.json"
        format: "json"
        fields:
          - label: "Left Page Header"
            name: "header"
            widget: "object"
            required: false
            fields:
              - { label: "Dossier Code", name: "code", widget: "string", default: "02 // PERSONAL PROJECTS", required: false }
              - { label: "Section Name", name: "title", widget: "string", default: "Personal Projects" }
              - { label: "Subtitle", name: "subtitle", widget: "string", default: "Game & Content Design", required: false }
              - { label: "Role / Tagline", name: "role", widget: "string", default: "Game Art • Podcast • Board Game", required: false }
          - label: "Projects List (Dossier Files)"
            name: "items"
            widget: "list"
            fields:
              - { label: "Project Name (Tab Title)", name: "title", widget: "string" }
              - { label: "Role", name: "role", widget: "string", required: false }
              - { label: "Status / Tag", name: "tag", widget: "string", default: "Coming Soon", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - label: "Links / Pennants"
                name: "links"
                widget: "list"
                required: false
                fields:
                  - label: "Platform"
                    name: "platform"
                    widget: "select"
                    options:
                      - { label: "GitHub", value: "github" }
                      - { label: "YouTube", value: "youtube" }
                      - { label: "Itch.io", value: "itch" }
                      - { label: "Website", value: "website" }
                      - { label: "LinkedIn", value: "linkedin" }
                      - { label: "X / Twitter", value: "x" }
                      - { label: "Discord", value: "discord" }
                      - { label: "Steam", value: "steam" }
                  - { label: "URL", name: "url", widget: "string" }
                  - { label: "Title / Hover Text", name: "title", widget: "string", required: false }

      - name: "awards"
        label: "03 // Awards"
        file: "content/awards.json"
        format: "json"
        fields:
          - label: "Left Page Header"
            name: "header"
            widget: "object"
            required: false
            fields:
              - { label: "Dossier Code", name: "code", widget: "string", default: "03 // AWARDS", required: false }
              - { label: "Section Name", name: "title", widget: "string", default: "Awards" }
              - { label: "Subtitle", name: "subtitle", widget: "string", default: "Honors & Achievements", required: false }
              - { label: "Role / Tagline", name: "role", widget: "string", default: "Game Jam Placements", required: false }
          - label: "Awards List (Dossier Files)"
            name: "items"
            widget: "list"
            fields:
              - { label: "Competition Name (Tab Title)", name: "title", widget: "string" }
              - { label: "Role", name: "role", widget: "string", required: false }
              - { label: "Date", name: "date", widget: "string", required: false }
              - { label: "Award / Achievement Description", name: "description", widget: "text", required: false }
              - label: "Links / Pennants"
                name: "links"
                widget: "list"
                required: false
                fields:
                  - label: "Platform"
                    name: "platform"
                    widget: "select"
                    options:
                      - { label: "Itch.io", value: "itch" }
                      - { label: "GitHub", value: "github" }
                      - { label: "YouTube", value: "youtube" }
                      - { label: "LinkedIn", value: "linkedin" }
                      - { label: "Website", value: "website" }
                  - { label: "URL", name: "url", widget: "string" }
                  - { label: "Title / Hover Text", name: "title", widget: "string", required: false }

      - name: "contact"
        label: "04 // Contact"
        file: "content/contact.json"
        format: "json"
        fields:
          - label: "Left Page Header"
            name: "header"
            widget: "object"
            required: false
            fields:
              - { label: "Dossier Code", name: "code", widget: "string", default: "04 // CONTACT", required: false }
              - { label: "Section Name", name: "title", widget: "string", default: "Contact" }
              - { label: "Subtitle", name: "subtitle", widget: "string", default: "Links & Inquiries", required: false }
              - { label: "Location / Role", name: "role", widget: "string", default: "Ankara, Turkey", required: false }
          - { label: "Section Title", name: "sectionTitle", widget: "string", default: "CONTACT", required: false }
          - { label: "Description Text", name: "description", widget: "string", default: "Feel free to reach out for projects, collaborations, or just to say hi.", required: false }
          - { label: "Email Address", name: "email", widget: "string", default: "hello@goktugsaylam.com" }
          - label: "Social Links / Pennants"
            name: "socials"
            widget: "list"
            required: false
            fields:
              - label: "Platform"
                name: "platform"
                widget: "select"
                options:
                  - { label: "Bento / Links", value: "bento" }
                  - { label: "GitHub", value: "github" }
                  - { label: "LinkedIn", value: "linkedin" }
                  - { label: "Itch.io", value: "itch" }
                  - { label: "YouTube", value: "youtube" }
                  - { label: "X / Twitter", value: "x" }
                  - { label: "Discord", value: "discord" }
                  - { label: "Instagram", value: "instagram" }
                  - { label: "Bluesky", value: "bluesky" }
                  - { label: "Telegram", value: "telegram" }
                  - { label: "Spotify", value: "spotify" }
                  - { label: "Steam", value: "steam" }
                  - { label: "Website", value: "website" }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Title / Hover Text", name: "title", widget: "string", required: false }

  - name: "settings"
    label: "Theme & Palette"
    delete: false
    editor:
      preview: false
    files:
      - name: "theme"
        label: "Color Palette & Themes"
        file: "content/theme.json"
        format: "json"
        fields:
          - label: "1. Temel Arayuz Renkleri (Base UI Colors)"
            name: "base"
            widget: "object"
            fields:
              - { label: "Sayfa Arka Plani (Page Background)", name: "bg", widget: "color", default: "#030303" }
              - { label: "Arka Plan Izgara Cizgisi (Grid Line)", name: "gridLine", widget: "string", default: "rgba(255, 255, 255, 0.12)" }
              - { label: "Klasor Govdesi Rengi (Folder Binder Body)", name: "folder", widget: "color", default: "#24272D" }
              - { label: "Ana Metin ve Basliklar (Main Text & Titles)", name: "textMain", widget: "color", default: "#FFFFFF" }

              - { label: "Hero Baslik ve Handle Vurgu Rengi (Kirmizi)", name: "heroAccent", widget: "color", default: "#E63D19" }
              - { label: "Birincil Vurgu Rengi (Primary Accent / Headers & Links)", name: "accent", widget: "color", default: "#F2AD21" }
              - { label: "Rol ve Ikincil Vurgu (Role & Secondary Accent)", name: "role", widget: "color", default: "#A4C723" }
          - label: "2. Klasor Dizin Sekmeleri (Dossier Tabs & Scramble Pool)"
            name: "tabs"
            widget: "object"
            fields:
              - { label: "Tab 00 // About Sekmesi (Canli Kirmizi)", name: "tab00", widget: "color", default: "#E63D19" }
              - { label: "Tab 01 // Organizations Sekmesi (Altin Sari)", name: "tab01", widget: "color", default: "#F2AD21" }
              - { label: "Tab 02 // Projects Sekmesi (Fistik Yesili)", name: "tab02", widget: "color", default: "#A4C723" }
              - { label: "Tab 03 // Awards Sekmesi (Teal / Petrol)", name: "tab03", widget: "color", default: "#1D9E99" }
              - { label: "Tab 04 // Contact Sekmesi (Mor)", name: "tab04", widget: "color", default: "#7C26CB" }
          - label: "3. @goktugsaylam Harf Efekti Renkleri (Scramble Colors)"
            name: "scramble"
            widget: "object"
            fields:
              - { label: "Efekt Rengi 1 (Kırmızı)", name: "color1", widget: "color", default: "#E63D19" }
              - { label: "Efekt Rengi 2 (Sarı)", name: "color2", widget: "color", default: "#F2AD21" }
              - { label: "Efekt Rengi 3 (Yeşil)", name: "color3", widget: "color", default: "#A4C723" }
              - { label: "Efekt Rengi 4 (Teal / Petrol)", name: "color4", widget: "color", default: "#1D9E99" }
              - { label: "Efekt Rengi 5 (Mor)", name: "color5", widget: "color", default: "#7C26CB" }
