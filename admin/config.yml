backend:
  name: github
  repo: GoktugSaylam/goktugsaylam.github.io
  branch: main

# Local backend support (local test with npx decap-server)
local_backend: true

# Media Uploads
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Panel Display Settings
display_url: "https://goktugsaylam.com"
locale: "en"

# Collections
collections:
  - name: "pages"
    label: "Pages and Content"
    delete: false
    editor:
      preview: false
    files:
      - name: "about"
        label: "00 // About"
        file: "content/about.json"
        format: "json"
        fields:
          - { label: "Name", name: "name", widget: "string", default: "Göktuğ Saylam" }
          - { label: "Subtitle", name: "subtitle", widget: "string", default: "Industrial Engineering" }
          - { label: "Role / Focus Area", name: "role", widget: "string", default: "Hackathon & Game Jam • Organization • Pixel Art" }
          - { label: "Section Title", name: "sectionTitle", widget: "string", default: "BIOGRAPHY" }
          - { label: "Biography Text", name: "bio", widget: "text" }

      - name: "organizations"
        label: "01 // Organizations"
        file: "content/organizations.json"
        format: "json"
        fields:
          - label: "Organizations List"
            name: "items"
            widget: "list"
            fields:
              - { label: "Event Name", name: "title", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Date", name: "date", widget: "string" }
              - { label: "Club / Organizer", name: "sub", widget: "string" }
              - label: "Links"
                name: "links"
                widget: "object"
                required: false
                fields:
                  - { label: "Itch.io Link", name: "itch", widget: "string", required: false }
                  - { label: "LinkedIn Link", name: "linkedin", widget: "string", required: false }

      - name: "projects"
        label: "02 // Personal Projects"
        file: "content/projects.json"
        format: "json"
        fields:
          - label: "Projects List"
            name: "items"
            widget: "list"
            fields:
              - { label: "Project Name", name: "title", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Status / Tag", name: "tag", widget: "string", default: "Coming Soon" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Links"
                name: "links"
                widget: "object"
                required: false
                fields:
                  - { label: "GitHub Link", name: "github", widget: "string", required: false }
                  - { label: "YouTube Link", name: "youtube", widget: "string", required: false }

      - name: "awards"
        label: "03 // Awards"
        file: "content/awards.json"
        format: "json"
        fields:
          - label: "Awards List"
            name: "items"
            widget: "list"
            fields:
              - { label: "Competition / Game Jam Name", name: "title", widget: "string" }
              - { label: "Role & Date", name: "role", widget: "string" }
              - { label: "Award / Achievement Description", name: "description", widget: "text" }
              - label: "Links"
                name: "links"
                widget: "object"
                required: false
                fields:
                  - { label: "Itch.io Link", name: "itch", widget: "string", required: false }

      - name: "contact"
        label: "04 // Contact"
        file: "content/contact.json"
        format: "json"
        fields:
          - { label: "Description Text", name: "description", widget: "string", default: "Feel free to reach out for projects, collaborations, or just to say hi." }
          - { label: "Email Address", name: "email", widget: "string", default: "hello@goktugsaylam.com" }
          - label: "Links"
            name: "links"
            widget: "object"
            fields:
              - { label: "Bento / Links URL", name: "bento", widget: "string", default: "https://links.goktugsaylam.com/" }
              - { label: "GitHub URL", name: "github", widget: "string", default: "https://github.com/GoktugSaylam" }
              - { label: "LinkedIn URL", name: "linkedin", widget: "string", default: "https://www.linkedin.com/in/goktugsaylam/" }
